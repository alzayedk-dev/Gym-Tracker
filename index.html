<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lets train 💪</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <header>
    <h1 class="logo">Lets train <span class="logo-icon" aria-hidden="true">💪</span></h1>
    <div id="user-bar" hidden>
      <span id="user-email"></span>
      <button id="sign-out" class="link">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Login / sign up -->
    <section id="auth-view" class="card" hidden>
      <h2 id="auth-title">Log in</h2>
      <p class="muted auth-sub">Plan your week, track every rep.</p>
      <button id="google-sign-in" class="google">Continue with Google</button>
      <div class="divider"><span>or</span></div>
      <form id="auth-form">
        <label>Email <input type="email" id="auth-email" required autocomplete="email"></label>
        <label>Password <input type="password" id="auth-password" required minlength="6" autocomplete="current-password"></label>
        <button type="submit" id="auth-submit">Log in</button>
      </form>
      <p id="auth-message" class="message"></p>
      <p class="switch">
        <span id="auth-switch-text">No account yet?</span>
        <button id="auth-switch" class="link">Sign up</button>
      </p>
    </section>

    <!-- Logged in -->
    <section id="app-view" hidden>
      <nav class="tabs">
        <button data-tab="week" class="active">This week</button>
        <button data-tab="new">New workout</button>
        <button data-tab="progress">Progress</button>
      </nav>
      <p id="app-message" class="message"></p>

      <!-- This week: sessions to track -->
      <div id="tab-week">
        <div class="week-nav">
          <button id="prev-week" class="icon-btn" title="Previous week">‹</button>
          <div class="week-label">
            <strong id="week-label"></strong>
            <button id="this-week" class="link small">Back to this week</button>
          </div>
          <button id="next-week" class="icon-btn" title="Next week">›</button>
        </div>
        <div class="filter-bar">
          <div id="type-filter" class="segmented"></div>
          <select id="filter-muscle" aria-label="Muscle"></select>
        </div>
        <div id="week-list"></div>
      </div>

      <!-- New workout builder -->
      <div id="tab-new" hidden>
        <div class="card step">
          <div class="step-head"><span class="step-num">1</span><h2>Workout type</h2></div>
          <div id="type-options" class="type-options"></div>
        </div>

        <div class="card step" id="step-when" hidden>
          <div class="step-head"><span class="step-num">2</span><h2>Days</h2></div>
          <label class="toggle-row">
            <input type="checkbox" id="recurring" checked>
            <span><strong>Recurring session</strong><br><span class="muted small">Repeats every week on the days you pick. Untick to pick exact dates instead.</span></span>
          </label>
          <div id="day-options" class="chips"></div>
          <div id="date-picker" hidden>
            <div class="date-row">
              <input type="date" id="date-input" aria-label="Date">
              <button type="button" id="add-date" class="secondary">Add date</button>
            </div>
            <div id="date-list" class="chips"></div>
          </div>
        </div>

        <div class="card step" id="step-exercises" hidden>
          <div class="step-head"><span class="step-num">3</span><h2>Exercises</h2></div>
          <div id="exercise-cards"></div>
          <button type="button" id="add-exercise" class="secondary wide-btn">+ Add exercise</button>
        </div>

        <button id="lets-train" class="cta" hidden>Lets train 💪</button>
      </div>

      <!-- Progress -->
      <div id="tab-progress" hidden>
        <div class="stats">
          <div class="card stat"><div class="stat-num" id="stat-week">0</div><div>workouts this week</div></div>
          <div class="card stat"><div class="stat-num" id="stat-month">0</div><div>workouts this month</div></div>
        </div>
        <div class="card">
          <h2>Completed workouts</h2>
          <div id="history-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
